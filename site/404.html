<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f1e9">
  <base href="/packetcode/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <title>Page not found — PacketCode</title>
  <style>
    .error-hero { min-height: 78vh; display: grid; align-content: center; justify-items: start; max-width: 900px; padding-top: 6rem; padding-bottom: 6rem; }
    .error-hero h1 { font-family: var(--display, Georgia, serif); font-weight: 400; font-size: clamp(3.5rem, 8vw, 7.5rem); line-height: .98; letter-spacing: -.04em; margin: 1rem 0 1.75rem; }
    .error-hero h1 em { color: var(--accent, #e85d3f); }
    .error-hero > p:not(.eyebrow) { max-width: 460px; color: var(--muted, #697064); line-height: 1.7; margin-bottom: 2rem; }
    .error-actions { display: flex; flex-wrap: wrap; gap: 1rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="PacketCode home"><span class="brand-mark" aria-hidden="true">[p_]</span>packetcode<span class="brand-dot">.</span></a>
    </div>
  </header>
  <main id="main" class="container error-hero">
    <p class="eyebrow">404 / PAGE NOT FOUND</p>
    <h1>A little off<br><em>the path.</em></h1>
    <p>This page may have moved, or the address might have a typo. Your next useful prompt is just around the corner.</p>
    <div class="error-actions">
      <a class="button button-primary" href="./">Back to PacketCode <span aria-hidden="true">↗</span></a>
      <a class="button button-outline" href="guide/">Open the guide <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>

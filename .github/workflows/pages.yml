name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.mjs'
      - 'playwright.site.config.js'
      - 'tests/site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.mjs'
      - 'playwright.site.config.js'
      - 'tests/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static website
        run: npm run build:site
      - name: Check desktop and mobile website
        run: npm run test:site
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-failures
          path: |
            playwright-report/site/
            test-results/site/
          retention-days: 7
      - name: Package GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

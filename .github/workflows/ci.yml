name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'
  GOLANGCI_LINT_VERSION: v2.9.0
  GOVULNCHECK_VERSION: v1.3.0
  GORELEASER_VERSION: v2.9.0

jobs:
  browser-manual:
    name: Offline manual (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-manual-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_flags: '-race -coverprofile=coverage.out'
          - os: macos-latest
            test_flags: ''
          - os: windows-latest
            test_flags: ''
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod verify
      - run: go test -count=1 ${{ matrix.test_flags }} ./...
      - name: Windows persistence contention stress
        if: runner.os == 'Windows'
        run: go test -count=10 ./internal/atomicfile

  tui-golden:
    name: TUI golden and protocol safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-tui.txt
      - run: python -m pip install -r scripts/requirements-tui.txt
      - run: make tui-golden-check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=ci -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/packetcode-${GOOS}-${GOARCH}${ext}" \
            ./cmd/packetcode

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
            binary: ./packetcode
          - os: macos-latest
            exe: ''
            binary: ./packetcode
          - os: windows-latest
            exe: '.exe'
            binary: '.\packetcode.exe'
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build native CLI
        run: go build -trimpath -ldflags "-s -w -X main.version=ci -X main.commit=${{ github.sha }}" -o packetcode${{ matrix.exe }} ./cmd/packetcode
      - name: Smoke version
        run: ${{ matrix.binary }} --version
      - name: Smoke help
        run: ${{ matrix.binary }} --help
      - name: Smoke headless run help
        run: ${{ matrix.binary }} run --help
      # The checks above prove the binary starts. This one drives the real
      # agent loop against a stdlib-only stub provider on loopback: credential
      # resolution, an approved write, the fail-closed approval path, the
      # dotenv secret refusal, and the compound-command deny floor. It needs no
      # credentials and no network. bash is explicit because the Windows runner
      # would otherwise use PowerShell.
      - name: End-to-end smoke
        shell: bash
        run: bash smoke.sh

  # The release pipeline, exercised on every push rather than first exercised
  # by tagging.
  #
  # `goreleaser check` validates the configuration file and nothing else. It
  # cannot tell you that the build hooks run, that six archives come out, that
  # the checksums match, or that the licence is inside them -- and those are
  # what break. A tag is the worst moment to learn any of it, because the
  # version number is already spent.
  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@v7.2.1
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      # No secrets and no OIDC token here, so the signing steps take their skip
      # paths -- which is itself worth exercising, since that is the path every
      # fork and every pull request takes.
      - uses: goreleaser/goreleaser-action@v7.2.1
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish
      - run: ./scripts/check-release-artifacts.sh dist
      - name: Installer signature logic
        run: bash scripts/test-install-verify.sh
      - name: Signing summary never exposes certificates
        run: sh scripts/test-signing-config.sh
      # Prove the built binary runs, not merely that it was produced. A
      # cross-compile that emits a broken amd64 Linux binary passes every other
      # check in this job.
      - run: |
          tar -xzf dist/packetcode-linux-amd64.tar.gz -C dist packetcode
          ./dist/packetcode --version
